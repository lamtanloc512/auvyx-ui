name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Package: build, check every export exists and the JS parses, list the tarball.
      - run: npm run check

  # Auvyx packages (packages/*): one build, then the browser checks.
  auvyx:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The version comes from packages/tests (playwright, pinned).
      - run: npx playwright install --with-deps chromium

      # Block pages are generated by packages/blocks/tools: they must match.
      - name: Blocks are up to date
        run: |
          npm run build -w @auvyx/blocks
          git diff --exit-code -- packages/blocks

      # ui → registry → docs, as on Vercel.
      - run: npm run auvyx:build

      # Types, CLI, React blocks vs HTML, split CSS vs bundle, ui-deps.json.
      - run: npm run auvyx:test

      - name: Keep screenshots of failed comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auvyx-failures
          path: packages/tests/.tmp/failures/
          if-no-files-found: ignore
          include-hidden-files: true
