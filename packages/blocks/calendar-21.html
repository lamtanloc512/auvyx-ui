<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar 21 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .cal-box {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      input[type="time"]::-webkit-calendar-picker-indicator {
        display: none;
      }

      .cal-price {
        --cell-size: 2.75rem;
      }
      .cal-price .calendar-month > table td > button {
        min-block-size: 2.75rem;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <auvyx-calendar
        id="cal"
        mode="range"
        months="2"
        value="2026-06-12/2026-06-17"
        month="2026-06"
        class="calendar cal-box cal-price"></auvyx-calendar>
    </main>
    <script>
      customElements.whenDefined("auvyx-calendar").then(() => {
        document.getElementById("cal").renderDay = (d) => {
          const we = d.getDay() === 0 || d.getDay() === 6;
          return we ? "$120" : "$100";
        };
      });
    </script>
  </body>
</html>
