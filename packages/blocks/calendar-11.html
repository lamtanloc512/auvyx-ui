<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar 11 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .cal-box {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      .cal-note {
        margin: 0;
        font-size: 0.875rem;
        color: var(--muted-foreground);
        text-align: center;
        text-wrap: balance;
      }
      .cal-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .cover > .cal-center,
      .cover > .card,
      .cover > form,
      .cover > .calendar {
        inline-size: auto;
      }
      input[type="time"]::-webkit-calendar-picker-indicator {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <div class="cal-center">
        <auvyx-calendar
          class="calendar cal-box"
          mode="range"
          months="2"
          min="2026-06-01"
          max="2026-07-31"
          month="2026-06"
          value="2026-06-12/2026-06-26"></auvyx-calendar>
        <p class="cal-note">We are open in June and July only.</p>
      </div>
    </main>
  </body>
</html>
