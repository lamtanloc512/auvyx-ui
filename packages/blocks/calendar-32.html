<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar 32 · Auvyx UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../ui/dist/auvyx.min.css">
<script src="../ui/dist/auvyx.min.js" defer></script>
<script>(function(){var r=document.documentElement,t=null;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.classList.toggle('dark',d)})()</script>
<style>
  body { background: var(--background); }
  .cal-box { border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
  .cal-note { margin: 0; font-size: 0.875rem; color: var(--muted-foreground); text-align: center; text-wrap: balance; }
  .cal-card { inline-size: fit-content; max-inline-size: 100%; }
  .cal-card > section { display: flex; justify-content: center; }
  .cal-card > section > .calendar { padding: 0; }
  .cal-center { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .cover > .cal-center, .cover > .card, .cover > form, .cover > .calendar { inline-size: auto; }
  .cal-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  .cal-row > .field { inline-size: auto; }
  .cal-times { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; inline-size: 100%; }
  .cal-times .field input { inline-size: 100%; }
  input[type='time']::-webkit-calendar-picker-indicator { display: none; }

  .cal-trigger { inline-size: 14rem; justify-content: flex-start; font-weight: 400; }
  .cal-dbody { display: flex; justify-content: center; padding-block-end: 1.5rem; }
  .cal-dbody .calendar { --cell-size: clamp(2.25rem, 11vw, 2.75rem); }
  .cal-dhead { text-align: center; }
</style>
</head>
<body>
<main class="cover"><form class="stack" data-gap="3" onsubmit="event.preventDefault()"><div role="group" class="field"><label for="dob-btn">Date of birth</label><button type="button" class="btn cal-trigger" data-variant="outline" id="dob-btn" commandfor="dob-drawer" command="show-modal"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span id="dob-text">Select date</span></button><input type="hidden" name="dob" id="dob"><p>This drawer is meant for small screens; on desktop use a popover.</p></div></form><dialog id="dob-drawer" class="drawer" aria-labelledby="dob-title"><article><header class="cal-dhead"><h2 id="dob-title">Select date</h2><p>Set your date of birth</p></header><section class="cal-dbody"><auvyx-calendar class="calendar" id="cal" caption="dropdown" min="1930-01-01" max="2026-12-31" month="2000-01"></auvyx-calendar></section></article></dialog></main>
<script>const c=document.getElementById('cal'),dlg=document.getElementById('dob-drawer');c.addEventListener('change',e=>{const d=e.detail.dates[0];document.getElementById('dob').value=e.detail.value;document.getElementById('dob-text').textContent=d.toLocaleDateString(undefined,{dateStyle:'long'});dlg.close();});</script>
</body>
</html>
