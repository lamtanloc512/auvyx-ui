<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar 13 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .cal-box {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      .cal-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .cover > .cal-center,
      .cover > .card,
      .cover > form,
      .cover > .calendar {
        inline-size: auto;
      }
      input[type="time"]::-webkit-calendar-picker-indicator {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <div class="cal-center">
        <auvyx-calendar
          class="calendar cal-box"
          id="cal"
          caption="dropdown"
          value="2026-06-12"
          min="2000-01-01"
          max="2035-12-31"></auvyx-calendar>
        <div role="group" class="field">
          <label for="layout">Dropdown</label>
          <select class="select" id="layout">
            <option value="dropdown">Month and Year</option>
            <option value="label">Label</option>
          </select>
        </div>
      </div>
    </main>
    <script>
      document.getElementById("layout").onchange = (e) =>
        document.getElementById("cal").setAttribute("caption", e.target.value);
    </script>
  </body>
</html>
