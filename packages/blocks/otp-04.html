<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTP 04 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .block-muted {
        background: var(--muted);
      }
      .block-wide {
        max-inline-size: 56rem;
      }
      .block-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        text-wrap: balance;
      }
      .block-title[data-size="xl"] {
        font-size: 1.25rem;
      }
      .block-lead {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        text-wrap: balance;
      }
      .block-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        text-align: center;
      }
      .block-center {
        text-align: center;
      }
      .block-image {
        position: relative;
        background: var(--muted);
        min-block-size: 0;
      }
      .block-image > img {
        position: absolute;
        inset: 0;
        inline-size: 100%;
        block-size: 100%;
        object-fit: cover;
      }
      html.dark .block-image > img {
        filter: brightness(0.2) grayscale(1);
      }
      .card > .field-separator > span,
      .card .field-separator > span {
        background: var(--card);
      }

      .block-legal {
        margin: 0;
        padding-inline: 1.5rem;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted-foreground);
        text-wrap: balance;
      }
      .block-legal a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .block-legal a:hover {
        color: var(--primary);
      }
      .block-otp {
        --slot: 2.75rem;
        align-self: center;
        inline-size: calc(var(--slot) * var(--length));
        font-size: 1.25rem;
      }
      .card > header.block-center {
        text-align: center;
      }

      .block-card-split {
        padding: 0;
      }
      .block-card-form {
        padding: 1.5rem;
        justify-content: center;
      }
      @media (width >= 48rem) {
        .block-card-form {
          padding: 2rem;
        }
      }
      @media (width < 48rem) {
        .block-hide-narrow {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="cover block-muted" data-pad="lg">
      <div class="stack block-wide" data-gap="6">
        <div class="card block-card-split">
          <div class="switcher" data-gap="0" style="--threshold: 44rem">
            <div class="stack block-card-form" data-gap="6">
              <div class="block-head">
                <h1 class="block-title">Enter verification code</h1>
                <p class="block-lead">We sent a 6-digit code to your email.</p>
              </div>
              <form class="fieldset" onsubmit="event.preventDefault()">
                <div role="group" class="field">
                  <label for="otp" class="sr-only">Verification code</label>
                  <div class="input-otp block-otp" data-length="6">
                    <input
                      id="otp"
                      inputmode="numeric"
                      autocomplete="one-time-code"
                      maxlength="6"
                      pattern="[0-9]{6}"
                      required />
                  </div>
                  <p class="block-center">
                    Didn't receive the code?
                    <a href="#">Resend</a>
                  </p>
                </div>
                <div role="group" class="field">
                  <button type="submit" class="btn">Verify</button>
                </div>
              </form>
            </div>
            <div class="block-image block-hide-narrow">
              <img src="assets/placeholder.svg" alt />
            </div>
          </div>
        </div>
        <p class="block-legal">
          By clicking continue, you agree to our
          <a href="#">Terms of Service</a>
          and
          <a href="#">Privacy Policy</a>
          .
        </p>
      </div>
    </main>
  </body>
</html>
