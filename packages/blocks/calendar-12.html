<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar 12 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .cal-card {
        inline-size: fit-content;
        max-inline-size: 100%;
      }
      .cal-card > section {
        display: flex;
        justify-content: center;
      }
      .cal-card > section > .calendar {
        padding: 0;
      }
      input[type="time"]::-webkit-calendar-picker-indicator {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <div class="card cal-card">
        <header>
          <h2>Book an appointment</h2>
          <p>Select the dates for your appointment</p>
          <div class="card-action">
            <select class="select" id="lang" aria-label="Language">
              <option value="en-US">English</option>
              <option value="es">Español</option>
              <option value="vi">Tiếng Việt</option>
              <option value="ja">日本語</option>
            </select>
          </div>
        </header>
        <section>
          <auvyx-calendar
            class="calendar"
            id="cal"
            mode="range"
            months="2"
            lang="en-US"
            value="2026-06-12/2026-06-26"></auvyx-calendar>
        </section>
      </div>
    </main>
    <script>
      document.getElementById("lang").onchange = (e) =>
        document.getElementById("cal").setAttribute("lang", e.target.value);
    </script>
  </body>
</html>
