<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Header 03 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .shop-line-meta {
        margin: 0;
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }
      .shop-bottom-nav {
        position: fixed;
        inset-block-end: 0;
        inset-inline: 0;
        z-index: 20;
        max-inline-size: 28rem;
        margin-inline: auto;
        padding-block-end: env(safe-area-inset-bottom, 0px);
        border-block-start: 1px solid var(--border);
        background: color-mix(in oklab, var(--background) 92%, transparent);
        backdrop-filter: blur(8px);
      }
      .shop-bottom-nav ul {
        display: grid;
        grid-auto-columns: 1fr;
        grid-auto-flow: column;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .shop-bottom-nav a {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        padding-block: 0.625rem 0.5rem;
        color: var(--muted-foreground);
        font-size: 0.6875rem;
        font-weight: 500;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }
      .shop-bottom-nav a svg {
        inline-size: 1.375rem;
        block-size: 1.375rem;
      }
      .shop-bottom-nav a[aria-current="page"] {
        color: var(--foreground);
      }
      .shop-bottom-nav a[aria-current="page"]::before {
        content: "";
        position: absolute;
        inset-block-start: 0;
        inline-size: 2rem;
        block-size: 2px;
        border-radius: 0 0 2px 2px;
        background: var(--primary);
      }
      .shop-bottom-nav a:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .shop-nav-icon {
        position: relative;
        display: inline-flex;
      }
      .shop-bottom-nav[data-variant="floating"] {
        inset-block-end: calc(1rem + env(safe-area-inset-bottom, 0px));
        inset-inline: 1rem;
        max-inline-size: 26rem;
        padding: 0.375rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 10px 30px -10px rgb(0 0 0 / 0.25);
      }
      .shop-bottom-nav[data-variant="floating"] a {
        padding-block: 0.5rem;
        border-radius: 999px;
      }
      .shop-bottom-nav[data-variant="floating"] a[aria-current="page"] {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .shop-bottom-nav[data-variant="floating"] a[aria-current="page"]::before {
        display: none;
      }
      .shop-bottom-nav[data-variant="floating"] a > span:not(.shop-nav-icon) {
        display: none;
      }
      .shop-bottom-nav[data-variant="floating"] a[aria-current="page"] {
        flex-direction: row;
        justify-content: center;
      }
      .shop-bottom-nav[data-variant="floating"] a[aria-current="page"] > span:not(.shop-nav-icon) {
        display: inline;
        font-size: 0.75rem;
      }

      /* Circles and pills stay round when a style sets --corner-shape (squircle on a 999px radius draws a rounded square). */
      .shop-bottom-nav {
        corner-shape: round;
      }
      .shop-bottom-nav a {
        corner-shape: round;
      }

      @keyframes shop-pop {
        from {
          transform: scale(0.96);
          opacity: 0.6;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      /* Reduced motion: the hover states still apply, without movement. !important so it wins over every card's transition rules. */

      .hf-demo {
        min-block-size: 24rem;
        padding: 3rem 1rem;
        display: grid;
        place-items: center;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        background: repeating-linear-gradient(
          -45deg,
          var(--muted),
          var(--muted) 10px,
          transparent 10px,
          transparent 20px
        );
      }
      .hf-demo p {
        margin: 0;
        padding: 0.5rem 1rem;
        border-radius: var(--radius);
        background: var(--background);
      }
      .hf-head {
        position: sticky;
        inset-block-start: 0;
        z-index: 20;
        border-block-end: 1px solid var(--border);
        background: color-mix(in oklab, var(--background) 94%, transparent);
        backdrop-filter: blur(10px);
      }
      .hf-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        block-size: 4rem;
      }
      .hf-row[data-size="lg"] {
        block-size: 5rem;
      }
      .hf-actions {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        margin-inline-start: auto;
      }
      .hf-burger {
        display: none;
      }
      .hf-sheet nav {
        display: grid;
        gap: 0.125rem;
      }
      .hf-sheet nav > a {
        padding: 0.625rem 0.75rem;
        border-radius: var(--radius);
        color: inherit;
        font-weight: 500;
        text-decoration: none;
      }
      .hf-sheet nav > a:hover {
        background: var(--accent);
      }
      .hf-sheet .accordion summary {
        padding-inline: 0.75rem;
        font-weight: 500;
      }
      .hf-sheet .accordion ul {
        display: grid;
        gap: 0.125rem;
        margin: 0;
        padding: 0 0 0.5rem 0.75rem;
        list-style: none;
      }
      .hf-sheet .accordion li a {
        display: block;
        padding: 0.5rem 0.75rem;
        border-radius: var(--radius);
        color: var(--muted-foreground);
        font-size: 0.875rem;
        text-decoration: none;
      }
      .hf-sheet .accordion li a:hover {
        background: var(--accent);
        color: var(--foreground);
      }
      .hf-sheet > section {
        display: grid;
        gap: 1rem;
        align-content: start;
      }
      .hf-mast {
        display: grid;
        justify-items: center;
        gap: 0.25rem;
        padding-block: 1.5rem 1rem;
        text-align: center;
      }
      .hf-mast a {
        color: inherit;
        text-decoration: none;
      }
      .hf-mast strong {
        font-family: var(--font-serif, Georgia, serif);
        font-size: clamp(2rem, 5vw, 3.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .hf-mast small {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .hf-catrow {
        display: flex;
        justify-content: center;
        gap: 0.25rem;
        padding-block: 0.25rem;
        border-block: 1px solid var(--border);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .hf-catrow a {
        flex: none;
        padding: 0.625rem 0.875rem;
        color: var(--muted-foreground);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .hf-catrow a:hover {
        color: var(--foreground);
        box-shadow: inset 0 -2px 0 currentColor;
      }
      .hf-catrow a[aria-current] {
        color: var(--foreground);
        box-shadow: inset 0 -2px 0 currentColor;
      }
      .hf-searchbox {
        display: none;
        padding-block: 0.75rem;
        border-block-start: 1px solid var(--border);
      }
      .hf-head[data-search] .hf-searchbox {
        display: block;
      }
      @media (width < 64rem) {
        .hf-hide-sm {
          display: none;
        }
        .hf-burger {
          display: inline-flex;
        }
      }
      .hf-bnav button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        inline-size: 100%;
        padding-block: 0.625rem 0.5rem;
        border: 0;
        background: none;
        color: var(--muted-foreground);
        font: inherit;
        font-size: 0.6875rem;
        font-weight: 500;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .hf-bnav button svg {
        inline-size: 1.375rem;
        block-size: 1.375rem;
      }
      .hf-bnav button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .hf-bnav {
        max-inline-size: none;
      }
      .hf-bnav a {
        padding-block-start: 0.875rem;
      }
      .hf-bnav button {
        padding-block-start: 0.875rem;
      }
      @media (width >= 48rem) {
        .hf-bnav {
          display: none;
        }
      }
      @media (width < 48rem) {
        .hf-burger.hf-burger {
          display: none;
        }
        body:has(.hf-bnav) {
          padding-block-end: calc(4rem + env(safe-area-inset-bottom, 0px));
        }
      }

      .hf-head .hf-row {
        position: relative;
      }
      .hf-head .hf-actions {
        position: absolute;
        inset-inline-end: 0;
      }
      @media (width < 64rem) {
        .hf-head .hf-actions {
          position: static;
        }
        .hf-catrow {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header class="hf-head" style="position: relative">
      <div class="wrapper hf-row" data-size="lg">
        <button
          type="button"
          class="btn hf-burger"
          data-variant="ghost"
          data-size="icon"
          aria-label="Open menu"
          commandfor="h3-menu"
          command="show-modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <div class="cluster hf-hide-sm" data-gap="1">
          <a href="#" class="btn" data-variant="ghost" data-size="icon" aria-label="RSS feed">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
          </a>
          <span class="shop-line-meta">Sunday, November 8, 2026</span>
        </div>
        <div class="hf-actions">
          <button
            type="button"
            class="btn"
            data-variant="ghost"
            data-size="icon"
            aria-label="Search"
            aria-expanded="false"
            data-search-toggle>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button
            type="button"
            class="btn"
            data-variant="ghost"
            data-size="icon"
            aria-label="Toggle dark mode"
            data-theme-toggle>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <a href="#" class="btn" data-size="sm">Subscribe</a>
        </div>
      </div>
      <div class="hf-mast">
        <a href="#"><strong>The Margin</strong></a>
        <small>Ideas, design and the people behind them</small>
      </div>
      <nav class="hf-catrow" aria-label="Sections">
        <a href="#" aria-current="page">Latest</a>
        <a href="#">Design</a>
        <a href="#">Technology</a>
        <a href="#">Culture</a>
        <a href="#">Travel</a>
        <a href="#">Food</a>
        <a href="#">Opinion</a>
        <a href="#">Podcasts</a>
      </nav>
      <div class="hf-searchbox">
        <form class="wrapper" data-size="md" role="search" onsubmit="event.preventDefault()">
          <div class="input-group">
            <input
              type="search"
              placeholder="Search articles, authors, topics..."
              aria-label="Search articles" />
            <span data-align="start" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          </div>
        </form>
      </div>
    </header>
    <dialog
      id="h3-menu"
      class="sheet hf-sheet"
      data-side="left"
      closedby="any"
      aria-labelledby="h3-menu-t">
      <header><h2 id="h3-menu-t">Sections</h2></header>
      <section>
        <nav aria-label="Mobile">
          <div class="accordion"></div>
          <a href="#">Latest</a>
          <a href="#">Design</a>
          <a href="#">Technology</a>
          <a href="#">Culture</a>
          <a href="#">Travel</a>
          <a href="#">Food</a>
          <a href="#">Opinion</a>
          <a href="#">Podcasts</a>
          <a href="#">About</a>
          <a href="#">Newsletter</a>
        </nav>
      </section>
      <button type="button" aria-label="Close menu" commandfor="h3-menu" command="close">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </dialog>
    <nav class="shop-bottom-nav hf-bnav" aria-label="Primary">
      <ul>
        <li>
          <a href="#" aria-current="page">
            <span class="shop-nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
            <span>Home</span>
          </a>
        </li>
        <li>
          <button type="button" commandfor="h3-menu" command="show-modal">
            <span class="shop-nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span>
            <span>Sections</span>
          </button>
        </li>
        <li>
          <a href="#">
            <span class="shop-nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
            <span>Search</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="shop-nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676a.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg></span>
            <span>Saved</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="shop-nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span>Account</span>
          </a>
        </li>
      </ul>
    </nav>
    <div class="hf-demo"><p>Article list</p></div>
    <script>
      // Announcement bar: previous/next messages, dismiss.
      document.querySelectorAll("[data-bar]").forEach((bar) => {
        const msgs = [...bar.querySelectorAll(".hf-bar-msgs > span")];
        let i = 0;
        const show = (n) => {
          i = (n + msgs.length) % msgs.length;
          msgs.forEach((m, k) => m.toggleAttribute("data-on", k === i));
        };
        bar.querySelector("[data-bar-prev]")?.addEventListener("click", () => show(i - 1));
        bar.querySelector("[data-bar-next]")?.addEventListener("click", () => show(i + 1));
        bar.querySelector("[data-bar-close]")?.addEventListener("click", () => {
          bar.hidden = true;
        });
      });
      // Search that opens under the header.
      document.querySelectorAll("[data-search-toggle]").forEach((b) =>
        b.addEventListener("click", () => {
          const head = b.closest(".hf-head");
          const open = !head.hasAttribute("data-search");
          head.toggleAttribute("data-search", open);
          b.setAttribute("aria-expanded", String(open));
          if (open) head.querySelector(".hf-searchbox input").focus();
        }),
      );
      // Header over a hero: solid once the page scrolls.
      document.querySelectorAll("[data-overlay]").forEach((h) => {
        const sync = () => h.toggleAttribute("data-scrolled", window.scrollY > 40);
        window.addEventListener("scroll", sync, { passive: true });
        sync();
      });
      // Newsletter forms: validate the email, then thank.
      document.querySelectorAll("[data-newsletter]").forEach((form) => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const input = form.querySelector("input[type=email]");
          const ok = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(input.value.trim());
          input.toggleAttribute("aria-invalid", !ok);
          form.querySelector("[data-news-error]").hidden = ok;
          if (!ok) {
            input.focus();
            return;
          }
          form.querySelector("[data-news-fields]").hidden = true;
          form.querySelector("[data-news-done]").hidden = false;
        });
      });
      // Footer link columns: open on wide screens, collapsible on small ones.
      (() => {
        const groups = document.querySelectorAll("[data-foot-group]");
        if (!groups.length) return;
        const mq = window.matchMedia("(width >= 48rem)");
        const apply = () =>
          groups.forEach((d) => {
            d.open = mq.matches;
          });
        mq.addEventListener("change", apply);
        apply();
      })();
      // Bottom tab bar: the tapped tab becomes current.
      document.querySelectorAll(".hf-bnav").forEach((nav) =>
        nav.addEventListener("click", (e) => {
          const a = e.target.closest("a");
          if (!a) return;
          e.preventDefault();
          nav.querySelectorAll("a[aria-current]").forEach((x) => x.removeAttribute("aria-current"));
          a.setAttribute("aria-current", "page");
        }),
      );
      // Back to top.
      document.querySelectorAll("[data-to-top]").forEach((b) => {
        const sync = () => b.toggleAttribute("data-show", window.scrollY > 300);
        window.addEventListener("scroll", sync, { passive: true });
        sync();
        b.addEventListener("click", () =>
          window.scrollTo({
            top: 0,
            behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth",
          }),
        );
      });

      document.querySelectorAll("[data-theme-toggle]").forEach((b) =>
        b.addEventListener("click", () => {
          const dark = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", dark);
          b.setAttribute("aria-pressed", String(dark));
        }),
      );
    </script>
  </body>
</html>
