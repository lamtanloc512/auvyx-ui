<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidebar 12 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        min-block-size: 100svh;
      }
      .sb-user-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.5rem;
        font-size: 0.875rem;
      }
      .sb-user-head > span:last-child {
        display: grid;
        line-height: 1.25;
      }
      .sb-user-head small {
        color: var(--muted-foreground);
        font-size: 0.75rem;
      }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        block-size: 4rem;
        padding-inline: 1rem;
        border-block-end: 1px solid var(--border);
        background: var(--background);
      }
      .app-header > hr[aria-orientation="vertical"] {
        align-self: center;
        block-size: 1rem;
        margin-inline-end: 0.5rem;
      }
      .app-body {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      @media (width < 48rem) {
        .sb-hide-sm {
          display: none;
        }
      }
      .sidebar > nav > header .dropdown-menu,
      .sidebar > nav > footer .dropdown-menu {
        display: flex;
        inline-size: 100%;
      }

      .sb-cal-head {
        block-size: 4rem;
        justify-content: center;
        border-block-end: 1px solid var(--sidebar-border);
      }
      .sb-cal {
        padding-inline: 0.25rem;
      }
      .sb-cal .calendar {
        --cell-size: 2.0625rem;
        padding: 0.5rem 0.25rem;
      }
      .sidebar > nav ul.sb-checks {
        border: 0;
        padding: 0;
      }
      .sb-checks label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.5rem;
        border-radius: calc(var(--radius) - 2px);
        font-size: 0.875rem;
        cursor: pointer;
      }
      .sb-checks label:hover {
        background: var(--sidebar-accent);
      }
      .sidebar > nav details > summary > span {
        font-weight: 500;
      }
      .sb-month {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 0.5rem;
      }
      .sb-day {
        aspect-ratio: 1;
        border-radius: 0.5rem;
        background: color-mix(in oklch, var(--muted) 60%, transparent);
      }
    </style>
  </head>
  <body>
    <aside id="app-sidebar" class="sidebar">
      <nav aria-label="Sidebar">
        <header class="sb-cal-head">
          <div class="dropdown-menu">
            <button
              type="button"
              data-sidebar-item
              data-size="lg"
              popovertarget="user36"
              aria-haspopup="menu">
              <span class="avatar" data-size="sm"><span>CN</span></span>
              <span>
                <strong>shadcn</strong>
                <small>m@example.com</small>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
            </button>
            <div
              id="user36"
              data-popover
              popover
              data-side="bottom"
              data-align="start"
              style="min-width: 14rem">
              <div role="menu" aria-label="Account">
                <div class="sb-user-head">
                  <span class="avatar" data-size="sm"><span>CN</span></span>
                  <span>
                    <strong>shadcn</strong>
                    <small>m@example.com</small>
                  </span>
                </div>
                <hr role="separator" />
                <button type="button" role="menuitem">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>

                  <span>Billing</span>
                </button>
                <button type="button" role="menuitem">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
                  <span>Notifications</span>
                </button>
                <hr role="separator" />
                <button type="button" role="menuitem">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                  <span>Log out</span>
                </button>
              </div>
            </div>
          </div>
        </header>
        <section>
          <div class="sb-cal">
            <auvyx-calendar class="calendar" value="2026-11-14"></auvyx-calendar>
          </div>
          <hr role="separator" />
          <div role="group" aria-label="My Calendars">
            <ul>
              <li>
                <details open>
                  <summary><span>My Calendars</span></summary>
                  <ul class="sb-checks">
                    <li>
                      <label>
                        <input type="checkbox" class="input" checked />
                        <span>Personal</span>
                      </label>
                    </li>
                    <li>
                      <label>
                        <input type="checkbox" class="input" />
                        <span>Work</span>
                      </label>
                    </li>
                    <li>
                      <label>
                        <input type="checkbox" class="input" />
                        <span>Family</span>
                      </label>
                    </li>
                  </ul>
                </details>
              </li>
            </ul>
          </div>
          <div role="group" aria-label="Favorites">
            <ul>
              <li>
                <details open>
                  <summary><span>Favorites</span></summary>
                  <ul class="sb-checks">
                    <li>
                      <label>
                        <input type="checkbox" class="input" checked />
                        <span>Holidays</span>
                      </label>
                    </li>
                    <li>
                      <label>
                        <input type="checkbox" class="input" />
                        <span>Birthdays</span>
                      </label>
                    </li>
                  </ul>
                </details>
              </li>
            </ul>
          </div>
          <div role="group" aria-label="Other">
            <ul>
              <li>
                <details open>
                  <summary><span>Other</span></summary>
                  <ul class="sb-checks">
                    <li>
                      <label>
                        <input type="checkbox" class="input" checked />
                        <span>Travel</span>
                      </label>
                    </li>
                    <li>
                      <label>
                        <input type="checkbox" class="input" />
                        <span>Reminders</span>
                      </label>
                    </li>
                    <li>
                      <label>
                        <input type="checkbox" class="input" />
                        <span>Deadlines</span>
                      </label>
                    </li>
                  </ul>
                </details>
              </li>
            </ul>
          </div>
        </section>
        <footer>
          <ul>
            <li>
              <a href="#">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <span>New Calendar</span>
              </a>
            </li>
          </ul>
        </footer>
      </nav>
    </aside>
    <main>
      <header class="app-header">
        <button
          type="button"
          class="btn"
          data-variant="ghost"
          data-size="icon-sm"
          data-sidebar-toggle="app-sidebar"
          aria-controls="app-sidebar"
          aria-label="Toggle sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <hr role="separator" aria-orientation="vertical" />
        <nav class="breadcrumb sb-crumb" aria-label="Breadcrumb">
          <ol>
            <li class="sb-hide-sm"><a href="#">Calendar</a></li>
            <li aria-hidden="true" class="sb-hide-sm"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></li>
            <li><span aria-current="page">November 2026</span></li>

      </header>

        <div class="sb-month">

</html>
