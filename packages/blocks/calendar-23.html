<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar 23 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      input[type="time"]::-webkit-calendar-picker-indicator {
        display: none;
      }

      .date-picker > button:first-child {
        inline-size: 18rem;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <form class="stack" data-gap="3" onsubmit="event.preventDefault()">
        <div role="group" class="field">
          <label for="from">Select your stay</label>
          <auvyx-date-picker class="date-picker" mode="range" months="2">
            <input id="from" type="date" name="from" value="2026-06-12" />
            <input type="date" name="to" value="2026-06-19" />
          </auvyx-date-picker>
        </div>
      </form>
    </main>
  </body>
</html>
