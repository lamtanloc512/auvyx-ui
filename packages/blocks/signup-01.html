<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signup 01 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .block-narrow {
        max-inline-size: 24rem;
      }
      .block-center {
        text-align: center;
      }
      .card > .field-separator > span,
      .card .field-separator > span {
        background: var(--card);
      }
    </style>
  </head>
  <body>
    <main class="cover" data-pad="lg">
      <div class="card block-narrow">
        <header>
          <h2>Create an account</h2>
          <p>Enter your information below to create your account</p>
        </header>
        <section>
          <form class="fieldset" onsubmit="event.preventDefault()">
            <div role="group" class="field">
              <label for="name">Full Name</label>
              <input id="name" type="text" placeholder="John Doe" required />
            </div>
            <div role="group" class="field">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="m@example.com" required />
              <p>We'll use this to contact you. We will not share your email with anyone else.</p>
            </div>
            <div role="group" class="field">
              <label for="password">Password</label>
              <input id="password" type="password" required />
              <p>Must be at least 8 characters long.</p>
            </div>
            <div role="group" class="field">
              <label for="confirm">Confirm Password</label>
              <input id="confirm" type="password" required />
              <p>Please confirm your password.</p>
            </div>
            <div role="group" class="field">
              <button type="submit" class="btn">Create Account</button>
              <button type="button" class="btn" data-variant="outline">Sign up with Google</button>
              <p class="block-center">
                Already have an account?
                <a href="#">Sign in</a>
              </p>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
