<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login 02 · Auvyx UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../ui/dist/auvyx.min.css">
<script src="../ui/dist/auvyx.min.js" defer></script>
<script>(function(){var r=document.documentElement,t=null;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.classList.toggle('dark',d)})()</script>
<style>
  body { background: var(--background); }
  .block-muted { background: var(--muted); }
  .block-narrow { max-inline-size: 24rem; }
  .block-wide { max-inline-size: 56rem; }
  .block-title { margin: 0; font-size: 1.5rem; font-weight: 700; text-wrap: balance; }
  .block-title[data-size='xl'] { font-size: 1.25rem; }
  .block-lead { margin: 0; color: var(--muted-foreground); font-size: 0.875rem; text-wrap: balance; }
  .block-head { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; text-align: center; }
  .block-center { text-align: center; }
  .block-link { margin-inline-start: auto; font-size: 0.875rem; color: inherit; text-underline-offset: 4px; text-decoration: none; }
  .block-link:hover { text-decoration: underline; }
  .field > p.block-center a, .block-foot a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
  .block-foot { margin: 0; text-align: center; font-size: 0.875rem; color: var(--muted-foreground); }
  .block-label-row { display: flex; align-items: center; }
  .block-image { position: relative; background: var(--muted); min-block-size: 0; }
  .block-image > img { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover; }
  html.dark .block-image > img { filter: brightness(0.2) grayscale(1); }
  .block-socials { display: grid; gap: 1rem; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  .block-socials > .btn { inline-size: 100%; }
  .card > .field-separator > span, .card .field-separator > span { background: var(--card); }

  .block-logo { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 500; color: inherit; text-decoration: none; }
  .block-logo-mark { display: inline-flex; align-items: center; justify-content: center; inline-size: 1.5rem; block-size: 1.5rem; border-radius: calc(var(--radius) - 2px); background: var(--primary); color: var(--primary-foreground); }
  .block-logo-mark svg { inline-size: 1rem; block-size: 1rem; }
  .block-legal { margin: 0; padding-inline: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--muted-foreground); text-wrap: balance; }
  .block-legal a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
  .block-legal a:hover { color: var(--primary); }
  .block-split { min-block-size: 100svh; }
  .block-pane { padding: 1.5rem; }
  .block-pane-body { flex: 1; display: flex; align-items: center; justify-content: center; }
  .block-pane-body > form { inline-size: 100%; }
  .block-brand { display: flex; justify-content: center; }
  @media (width >= 48rem) { .block-pane { padding: 2.5rem; } .block-brand { justify-content: flex-start; } }
  @media (width < 64rem) { .block-hide-narrow { display: none; } }

</style>
</head>
<body>
<div class="switcher block-split" style="--threshold: 64rem">
  <div class="stack block-pane" data-gap="4">
    <div class="block-brand"><a href="#" class="block-logo"><span class="block-logo-mark"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>Acme Inc.</a></div>
    <div class="block-pane-body">
      <form class="fieldset block-narrow" onsubmit="event.preventDefault()">
        <div class="block-head">
          <h1 class="block-title">Login to your account</h1>
          <p class="block-lead">Enter your email below to login to your account</p>
        </div>
        <div role="group" class="field">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="m@example.com" required>
  </div>
  <div role="group" class="field">
    <div class="block-label-row"><label for="password">Password</label><a href="#" class="block-link">Forgot your password?</a></div>
    <input id="password" type="password" required>
  </div>
        <div role="group" class="field"><button type="submit" class="btn">Login</button></div>
        <div class="field-separator"><hr role="separator"><span>Or continue with</span></div>
        <div role="group" class="field">
          <button type="button" class="btn" data-variant="outline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="currentColor"/></svg>Login with GitHub</button>
          <p class="block-center">Don't have an account? <a href="#">Sign up</a></p>
        </div>
      </form>
    </div>
  </div>
  <div class="block-image block-hide-narrow"><img src="assets/placeholder.svg" alt=""></div>
</div>
</body>
</html>
