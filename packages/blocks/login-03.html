<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login 03 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .block-muted {
        background: var(--muted);
      }
      .block-narrow {
        max-inline-size: 24rem;
      }
      .block-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        text-wrap: balance;
      }
      .block-title[data-size="xl"] {
        font-size: 1.25rem;
      }
      .block-center {
        text-align: center;
      }
      .block-link {
        margin-inline-start: auto;
        font-size: 0.875rem;
        color: inherit;
        text-underline-offset: 4px;
        text-decoration: none;
      }
      .block-link:hover {
        text-decoration: underline;
      }
      .block-label-row {
        display: flex;
        align-items: center;
      }
      .card > .field-separator > span,
      .card .field-separator > span {
        background: var(--card);
      }

      .block-logo {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
        color: inherit;
        text-decoration: none;
      }
      .block-logo-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        inline-size: 1.5rem;
        block-size: 1.5rem;
        border-radius: calc(var(--radius) - 2px);
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .block-logo-mark svg {
        inline-size: 1rem;
        block-size: 1rem;
      }
      .block-legal {
        margin: 0;
        padding-inline: 1.5rem;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted-foreground);
        text-wrap: balance;
      }
      .block-legal a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .block-legal a:hover {
        color: var(--primary);
      }
      .block-brand {
        display: flex;
        justify-content: center;
      }
      .card > header.block-center {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="cover block-muted" data-pad="lg">
      <div class="stack block-narrow" data-gap="6">
        <div class="block-brand">
          <a href="#" class="block-logo">
            <span class="block-logo-mark"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>
            Acme Inc.
          </a>
        </div>
        <div class="card">
          <header class="block-center">
            <h2 class="block-title" data-size="xl">Welcome back</h2>
            <p>Login with your Apple or Google account</p>
          </header>
          <section>
            <form class="fieldset" onsubmit="event.preventDefault()">
              <div role="group" class="field">
                <button type="button" class="btn" data-variant="outline">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="currentColor"/></svg>
                  Login with Apple
                </button>
                <button type="button" class="btn" data-variant="outline">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" fill="currentColor"/></svg>
                  Login with Google
                </button>
              </div>
              <div class="field-separator">
                <hr role="separator" />
                <span>Or continue with</span>
              </div>
              <div role="group" class="field">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="m@example.com" required />
              </div>
              <div role="group" class="field">
                <div class="block-label-row">
                  <label for="password">Password</label>
                  <a href="#" class="block-link">Forgot your password?</a>
                </div>
                <input id="password" type="password" required />
              </div>
              <div role="group" class="field">
                <button type="submit" class="btn">Login</button>
                <p class="block-center">
                  Don't have an account?
                  <a href="#">Sign up</a>
                </p>
              </div>
            </form>
          </section>
        </div>
        <p class="block-legal">
          By clicking continue, you agree to our
          <a href="#">Terms of Service</a>
          and
          <a href="#">Privacy Policy</a>
          .
        </p>
      </div>
    </main>
  </body>
</html>
