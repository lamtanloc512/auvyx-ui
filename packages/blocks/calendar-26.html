<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar 26 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .cal-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: end;
      }
      .cal-row > .field {
        inline-size: auto;
      }
      input[type="time"]::-webkit-calendar-picker-indicator {
        display: none;
      }

      .date-picker > button:first-child {
        inline-size: 10rem;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <form class="stack" data-gap="4" onsubmit="event.preventDefault()">
        <div class="cal-row">
          <div role="group" class="field">
            <label for="checkin">Check-in</label>
            <auvyx-date-picker class="date-picker">
              <input id="checkin" type="date" name="checkin" value="2026-06-12" />
            </auvyx-date-picker>
          </div>
          <div role="group" class="field">
            <label for="checkint" class="sr-only">Check-in time</label>
            <input id="checkint" type="time" name="checkin_time" value="14:00" />
          </div>
        </div>
        <div class="cal-row">
          <div role="group" class="field">
            <label for="checkout">Check-out</label>
            <auvyx-date-picker class="date-picker">
              <input id="checkout" type="date" name="checkout" value="2026-06-19" />
            </auvyx-date-picker>
          </div>
          <div role="group" class="field">
            <label for="checkoutt" class="sr-only">Check-out time</label>
            <input id="checkoutt" type="time" name="checkout_time" value="11:00" />
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
