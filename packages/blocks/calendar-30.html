<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar 30 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      input[type="time"]::-webkit-calendar-picker-indicator {
        display: none;
      }

      .date-picker > button:first-child {
        inline-size: 16rem;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <form class="stack" data-gap="3" onsubmit="event.preventDefault()">
        <div role="group" class="field">
          <label for="trip">Trip dates</label>
          <auvyx-date-picker class="date-picker" mode="range" id="trip">
            <input id="trip-from" type="date" name="from" value="2026-06-04" />
            <input type="date" name="to" value="2026-06-10" />
          </auvyx-date-picker>
          <p id="trip-out" aria-live="polite"></p>
        </div>
      </form>
    </main>
    <script>
      const t = document.getElementById("trip"),
        o = document.getElementById("trip-out");
      const f = new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric",
      });
      function upd() {
        const [a, b] = t.value.split("/");
        if (a && b) {
          const n = Math.round((new Date(b) - new Date(a)) / 86400000);
          o.textContent = `${f.formatRange(new Date(a + "T00:00"), new Date(b + "T00:00"))} · ${n} night${n === 1 ? "" : "s"}`;
        }
      }
      t.addEventListener("change", upd);
      customElements.whenDefined("auvyx-date-picker").then(() => requestAnimationFrame(upd));
    </script>
  </body>
</html>
