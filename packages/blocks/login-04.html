<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login 04 · Auvyx UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../ui/dist/auvyx.min.css">
<script src="../ui/dist/auvyx.min.js" defer></script>
<script>(function(){var r=document.documentElement,t=null;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.classList.toggle('dark',d)})()</script>
<style>
  body { background: var(--background); }
  .block-muted { background: var(--muted); }
  .block-narrow { max-inline-size: 24rem; }
  .block-wide { max-inline-size: 56rem; }
  .block-title { margin: 0; font-size: 1.5rem; font-weight: 700; text-wrap: balance; }
  .block-title[data-size='xl'] { font-size: 1.25rem; }
  .block-lead { margin: 0; color: var(--muted-foreground); font-size: 0.875rem; text-wrap: balance; }
  .block-head { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; text-align: center; }
  .block-center { text-align: center; }
  .block-link { margin-inline-start: auto; font-size: 0.875rem; color: inherit; text-underline-offset: 4px; text-decoration: none; }
  .block-link:hover { text-decoration: underline; }
  .field > p.block-center a, .block-foot a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
  .block-foot { margin: 0; text-align: center; font-size: 0.875rem; color: var(--muted-foreground); }
  .block-label-row { display: flex; align-items: center; }
  .block-image { position: relative; background: var(--muted); min-block-size: 0; }
  .block-image > img { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover; }
  html.dark .block-image > img { filter: brightness(0.2) grayscale(1); }
  .block-socials { display: grid; gap: 1rem; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  .block-socials > .btn { inline-size: 100%; }
  .card > .field-separator > span, .card .field-separator > span { background: var(--card); }

  .block-logo { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 500; color: inherit; text-decoration: none; }
  .block-logo-mark { display: inline-flex; align-items: center; justify-content: center; inline-size: 1.5rem; block-size: 1.5rem; border-radius: calc(var(--radius) - 2px); background: var(--primary); color: var(--primary-foreground); }
  .block-logo-mark svg { inline-size: 1rem; block-size: 1rem; }
  .block-legal { margin: 0; padding-inline: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--muted-foreground); text-wrap: balance; }
  .block-legal a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
  .block-legal a:hover { color: var(--primary); }
  .block-card-split { padding: 0; }
  .block-card-form { padding: 1.5rem; }
  @media (width >= 48rem) { .block-card-form { padding: 2rem; } }
  @media (width < 48rem) { .block-hide-narrow { display: none; } }

</style>
</head>
<body>
<main class="cover block-muted" data-pad="lg">
  <div class="stack block-wide" data-gap="6">
    <div class="card block-card-split">
      <div class="switcher" data-gap="0" style="--threshold: 44rem">
        <form class="fieldset block-card-form" onsubmit="event.preventDefault()">
          <div class="block-head">
            <h1 class="block-title">Welcome back</h1>
            <p class="block-lead">Login to your Acme Inc account</p>
          </div>
          <div role="group" class="field">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="m@example.com" required>
  </div>
  <div role="group" class="field">
    <div class="block-label-row"><label for="password">Password</label><a href="#" class="block-link">Forgot your password?</a></div>
    <input id="password" type="password" required>
  </div>
          <div role="group" class="field"><button type="submit" class="btn">Login</button></div>
          <div class="field-separator"><hr role="separator"><span>Or continue with</span></div>
          <div class="block-socials">
            <button type="button" class="btn" data-variant="outline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="currentColor"/></svg><span class="sr-only">Login with Apple</span></button>
            <button type="button" class="btn" data-variant="outline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" fill="currentColor"/></svg><span class="sr-only">Login with Google</span></button>
            <button type="button" class="btn" data-variant="outline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.908 44.908 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.358-2.602zm-10.201.553c1.265 0 2.058.791 2.675 1.446.307.327.737.871 1.234 1.579l-1.02 1.566c-.757 1.163-1.882 3.017-2.837 4.338-1.191 1.649-1.81 1.817-2.486 1.817-.524 0-1.038-.237-1.383-.794-.263-.426-.464-1.13-.464-2.046 0-2.221.63-4.535 1.66-6.088.454-.687.964-1.226 1.533-1.533a2.264 2.264 0 0 1 1.088-.285z" fill="currentColor"/></svg><span class="sr-only">Login with Meta</span></button>
          </div>
          <p class="block-foot">Don't have an account? <a href="#">Sign up</a></p>
        </form>
        <div class="block-image block-hide-narrow"><img src="assets/placeholder.svg" alt=""></div>
      </div>
    </div>
    <p class="block-legal">By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
  </div>
</main>
</body>
</html>
