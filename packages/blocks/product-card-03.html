<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Card 03 · Auvyx UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../ui/dist/auvyx.min.css" />
    <script src="../ui/dist/auvyx.min.js" defer></script>
    <script>
      (function () {
        var r = document.documentElement,
          t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.classList.toggle("dark", d);
      })();
    </script>
    <style>
      body {
        background: var(--background);
      }
      .shop-page {
        padding-block: 2rem 4rem;
      }
      .shop-h1 {
        margin: 0;
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .shop-lead {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }
      .shop-line-meta {
        margin: 0;
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }

      .shop-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .shop-card-media {
        position: relative;
        overflow: hidden;
        border-radius: var(--radius);
        background: var(--muted);
      }
      .shop-card-media > img {
        display: block;
        aspect-ratio: 4 / 5;
        inline-size: 100%;
        object-fit: cover;
        transition: transform 300ms ease;
      }
      .shop-card:hover .shop-card-media > img {
        transform: scale(1.03);
      }
      html.dark .shop-card-media > img {
        filter: brightness(0.5) grayscale(1);
      }
      .shop-card-badge {
        position: absolute;
        inset-block-start: 0.75rem;
        inset-inline-start: 0.75rem;
      }
      .shop-card-tools {
        position: absolute;
        inset-block-start: 0.5rem;
        inset-inline-end: 0.5rem;
        display: grid;
        gap: 0.375rem;
      }
      .shop-card-tools .btn {
        background: var(--background);
      }
      .shop-card-body {
        display: grid;
        gap: 0.25rem;
      }
      .shop-card-name {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 500;
      }
      .shop-card-name a {
        color: inherit;
        text-decoration: none;
      }
      .shop-card-name a::after {
        content: "";
        position: absolute;
        inset: 0;
      }
      .shop-card-name a:focus-visible {
        outline: none;
      }
      .shop-card:has(.shop-card-name a:focus-visible) .shop-card-media {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .shop-card-tools {
        z-index: 2;
      }
      .shop-card-actions {
        position: relative;
        z-index: 1;
      }
      .shop-colors {
        position: relative;
        z-index: 1;
      }
      .shop-price {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .shop-price strong {
        font-size: 0.9375rem;
        font-weight: 600;
      }
      .shop-price s {
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }
      .shop-price[data-size="lg"] strong {
        font-size: 1.5rem;
      }
      .shop-price[data-size="lg"] s {
        font-size: 1rem;
      }
      .shop-wish[aria-pressed="true"] {
        color: var(--destructive);
      }
      .shop-wish[aria-pressed="true"] svg {
        fill: currentColor;
      }
      .shop-colors {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        border: 0;
        margin: 0;
        padding: 0;
      }
      .shop-colors legend {
        margin-block-end: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .shop-colors legend span {
        color: var(--muted-foreground);
        font-weight: 400;
      }
      .shop-colors label {
        position: relative;
        display: inline-flex;
        inline-size: 1.75rem;
        block-size: 1.75rem;
        border-radius: 999px;
        background: var(--dot);
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 15%, transparent);
        cursor: pointer;
      }
      .shop-colors input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .shop-colors label:has(:checked) {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .shop-colors label:has(:focus-visible) {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .shop-colors[data-size="sm"] label {
        inline-size: 1.25rem;
        block-size: 1.25rem;
      }
      .shop-card-actions {
        display: flex;
        gap: 0.5rem;
      }
      .shop-card-actions > .btn:first-child {
        flex: 1;
      }
      .shop-cards {
        display: grid;
        gap: 2rem 1.5rem;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr));
      }
      .shop-cards[data-layout="list"] {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .shop-hcard-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="wrapper shop-page">
      <div class="stack" data-gap="6">
        <div class="stack" data-gap="1">
          <h1 class="shop-h1">Pick your color</h1>
          <p class="shop-lead">Every piece comes in seasonal colors.</p>
        </div>
        <div class="shop-cards">
          <article class="shop-card" data-swatch-card>
            <div class="shop-card-media">
              <img src="assets/placeholder.svg" alt />
              <span class="badge shop-card-badge">New</span>
              <div class="shop-card-tools">
                <button
                  type="button"
                  class="btn shop-wish"
                  data-variant="outline"
                  data-size="icon-sm"
                  aria-pressed="false"
                  aria-label="Save Everyday Tote to wishlist"
                  data-wish>
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676a.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                </button>
              </div>
            </div>
            <div class="shop-card-body">
              <div class="shop-hcard-top">
                <h3 class="shop-card-name"><a href="#">Everyday Tote</a></h3>
                <p class="shop-price"><strong>$48.00</strong></p>
              </div>
              <p class="shop-line-meta" data-color-label>Natural</p>
              <fieldset class="shop-colors" data-size="sm">
                <legend class="sr-only">Color</legend>
                <label style="--dot: #e8dcc4" title="Natural">
                  <input type="radio" name="pc3-0" value="Natural" aria-label="Natural" checked />
                </label>
                <label style="--dot: #262626" title="Black">
                  <input type="radio" name="pc3-0" value="Black" aria-label="Black" />
                </label>
                <label style="--dot: #6b6b3a" title="Olive">
                  <input type="radio" name="pc3-0" value="Olive" aria-label="Olive" />
                </label>
              </fieldset>
            </div>
            <div class="shop-card-actions">
              <button type="button" class="btn" data-variant="outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a4 4 0 0 1-8 0M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>
                Add to cart
              </button>
            </div>
          </article>
          <article class="shop-card" data-swatch-card>
            <div class="shop-card-media">
              <img src="assets/placeholder.svg" alt />
              <span class="badge shop-card-badge" data-variant="destructive">Sale</span>
              <div class="shop-card-tools">
                <button
                  type="button"
                  class="btn shop-wish"
                  data-variant="outline"
                  data-size="icon-sm"
                  aria-pressed="false"
                  aria-label="Save Merino Crew Sweater to wishlist"
                  data-wish>
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676a.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                </button>
              </div>
            </div>
            <div class="shop-card-body">
              <div class="shop-hcard-top">
                <h3 class="shop-card-name"><a href="#">Merino Crew Sweater</a></h3>
                <p class="shop-price">
                  <strong>$89.00</strong>
                  <s>$119.00</s>
                  <span class="sr-only">Was $119.00</span>
                </p>
              </div>
              <p class="shop-line-meta" data-color-label>Charcoal</p>
              <fieldset class="shop-colors" data-size="sm">
                <legend class="sr-only">Color</legend>
                <label style="--dot: #3f3f46" title="Charcoal">
                  <input type="radio" name="pc3-1" value="Charcoal" aria-label="Charcoal" checked />
                </label>
                <label style="--dot: #d6cbb5" title="Oat">
                  <input type="radio" name="pc3-1" value="Oat" aria-label="Oat" />
                </label>
                <label style="--dot: #1e3a5f" title="Navy">
                  <input type="radio" name="pc3-1" value="Navy" aria-label="Navy" />
                </label>
              </fieldset>
            </div>
            <div class="shop-card-actions">
              <button type="button" class="btn" data-variant="outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a4 4 0 0 1-8 0M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>
                Add to cart
              </button>
            </div>
          </article>
          <article class="shop-card" data-swatch-card>
            <div class="shop-card-media">
              <img src="assets/placeholder.svg" alt />
              <span class="badge shop-card-badge" data-variant="destructive">Sale</span>
              <div class="shop-card-tools">
                <button
                  type="button"
                  class="btn shop-wish"
                  data-variant="outline"
                  data-size="icon-sm"
                  aria-pressed="false"
                  aria-label="Save Linen Throw Pillow to wishlist"
                  data-wish>
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676a.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                </button>
              </div>
            </div>
            <div class="shop-card-body">
              <div class="shop-hcard-top">
                <h3 class="shop-card-name"><a href="#">Linen Throw Pillow</a></h3>
                <p class="shop-price">
                  <strong>$32.00</strong>
                  <s>$40.00</s>
                  <span class="sr-only">Was $40.00</span>
                </p>
              </div>
              <p class="shop-line-meta" data-color-label>Clay</p>
              <fieldset class="shop-colors" data-size="sm">
                <legend class="sr-only">Color</legend>
                <label style="--dot: #c2856a" title="Clay">
                  <input type="radio" name="pc3-2" value="Clay" aria-label="Clay" checked />
                </label>
                <label style="--dot: #9caf88" title="Sage">
                  <input type="radio" name="pc3-2" value="Sage" aria-label="Sage" />
                </label>
                <label style="--dot: #f1ead8" title="Ivory">
                  <input type="radio" name="pc3-2" value="Ivory" aria-label="Ivory" />
                </label>
              </fieldset>
            </div>
            <div class="shop-card-actions">
              <button type="button" class="btn" data-variant="outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a4 4 0 0 1-8 0M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>
                Add to cart
              </button>
            </div>
          </article>
          <article class="shop-card" data-swatch-card>
            <div class="shop-card-media">
              <img src="assets/placeholder.svg" alt />
              <span class="badge shop-card-badge" data-variant="secondary">Bestseller</span>
              <div class="shop-card-tools">
                <button
                  type="button"
                  class="btn shop-wish"
                  data-variant="outline"
                  data-size="icon-sm"
                  aria-pressed="false"
                  aria-label="Save Leather Card Holder to wishlist"
                  data-wish>
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676a.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                </button>
              </div>
            </div>
            <div class="shop-card-body">
              <div class="shop-hcard-top">
                <h3 class="shop-card-name"><a href="#">Leather Card Holder</a></h3>
                <p class="shop-price"><strong>$29.00</strong></p>
              </div>
              <p class="shop-line-meta" data-color-label>Tan</p>
              <fieldset class="shop-colors" data-size="sm">
                <legend class="sr-only">Color</legend>
                <label style="--dot: #b07a4f" title="Tan">
                  <input type="radio" name="pc3-3" value="Tan" aria-label="Tan" checked />
                </label>
                <label style="--dot: #262626" title="Black">
                  <input type="radio" name="pc3-3" value="Black" aria-label="Black" />
                </label>
              </fieldset>
            </div>
            <div class="shop-card-actions">
              <button type="button" class="btn" data-variant="outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a4 4 0 0 1-8 0M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>
                Add to cart
              </button>
            </div>
          </article>
        </div>
      </div>
    </main>
    <script>
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-wish]");
        if (!b) return;
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        document.querySelectorAll("[data-wish-count]").forEach((el) => {
          const n = Math.max(0, (parseInt(el.textContent, 10) || 0) + (on ? 1 : -1));
          el.textContent = n;
          el.dataset.count = n;
        });
      });

      document.querySelectorAll("[data-swatch-card]").forEach((card) => {
        card.addEventListener("change", (e) => {
          if (e.target.matches("input[type=radio]"))
            card.querySelector("[data-color-label]").textContent = e.target.value;
        });
      });
    </script>
  </body>
</html>
