<p><code>class="skeleton"</code> is a pulsing placeholder that takes the size you give it. <code>data-variant</code> gives it one without utility classes: <code>text</code> (a full-width line of body text; set a <code>width</code> for shorter lines), <code>circle</code> (a 2.5rem avatar) and <code>block</code> (a full-width 16:9 media box).</p>
