<p>Use <code>scrollbar</code> or <code>scrollbar-sm</code> on an element that already scrolls with <code>overflow-auto</code>, <code>overflow-y-auto</code>, or <code>overflow-x-auto</code>.</p>
<p>The component class augments native scrolling for cross-browser styling. It does not wrap content, replace browser scroll behavior, or require JavaScript.</p>
