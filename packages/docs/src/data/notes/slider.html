<h3 class="d-h3">HTML structure</h3>
<dl>
  <dt><code>&lt;input type="range" class="input"&gt;</code></dt>
  <dd>Native range input styled as a slider. Width utilities such as <code>w-full</code> can be added directly.</dd>
</dl>
  
<p>Auvyx intentionally uses the native range input. Unlike shadcn/ui&#39;s Base UI slider, it does not support multiple thumbs or vertical orientation.</p>
